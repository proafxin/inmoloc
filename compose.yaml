x-models: &models
  - ${MODELS_DIR:-/home/masterkenway/Projects/citadel/data/gguf_models}:/models:ro

x-gpu: &gpu
  resources:
    reservations:
      devices:
        - driver: nvidia
          count: all
          capabilities: [gpu]

services:
  ocrbench-llamacpp:
    image: ${LLAMACPP_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda}
    container_name: ocrbench-llamacpp
    restart: "no"
    ipc: host
    command:
      - --model
      - /models/PaddleOCR-VL-1.6/PaddleOCR-VL-1.6-Q8_0.gguf
      - --mmproj
      - /models/PaddleOCR-VL-1.6/PaddleOCR-VL-1.6-GGUF-mmproj.gguf
      - --chat-template-file
      - /models/PaddleOCR-VL-1.6/chat_template.jinja
      - -ngl
      - "999"
      - --host
      - 0.0.0.0
      - --port
      - "8110"
      - -c
      - "${OCR_CTX:-184320}"
      - --parallel
      - "${OCR_PARALLEL:-45}"
      - --cache-ram
      - "4096"
      - --metrics
      - --cache-type-k
      - bf16
      - --cache-type-v
      - bf16
      - --flash-attn
      - "on"
      - --alias
      - ocrt
    ports:
      - "8110:8110"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8110/health"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 3
    ulimits:
      memlock: -1
      stack: 67108864
    volumes: *models
    deploy: *gpu

  ocrbench-inmoloc:
    image: ${INMOLOC_IMAGE:-inmoloc:sched6}
    container_name: ocrbench-inmoloc
    restart: "no"
    ipc: host
    command:
      - --model
      - /models/PaddleOCR-VL-1.6/PaddleOCR-VL-1.6-Q8_0.gguf
      - --mmproj
      - /models/PaddleOCR-VL-1.6/PaddleOCR-VL-1.6-GGUF-mmproj.gguf
      - --chat-template-file
      - /models/PaddleOCR-VL-1.6/chat_template.jinja
      - -ngl
      - "999"
      - --host
      - 0.0.0.0
      - --port
      - "8111"
      - --vram-budget
      - ${OCR_BUDGET:-5G}
      - --cache-ram
      - "4096"
      - --metrics
      - --cache-type-k
      - bf16
      - --cache-type-v
      - bf16
      - --flash-attn
      - "on"
      - --alias
      - ocrt
      # diagnostics: log a time breakdown of every main-loop iteration slower than 30 ms
      - --slow-loop-ms
      - "30"
    ports:
      - "8111:8111"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8111/health"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 3
    ulimits:
      memlock: -1
      stack: 67108864
    volumes: *models
    deploy: *gpu
