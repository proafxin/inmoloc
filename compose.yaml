x-models: &models
  - ${MODELS_DIR:-/home/masterkenway/models}:/models:ro

x-gpu: &gpu
  resources:
    reservations:
      devices:
        - driver: nvidia
          count: all
          capabilities: [gpu]

services:
  qwen:
    image: inmoloc:latest
    container_name: qwen
    restart: unless-stopped
    ipc: host
    command:
      - --model
      - /models/Kvark-Sparkle-1.0-27B-Q4_K_M.gguf
      - -ngl
      - "999"
      - --host
      - 0.0.0.0
      - --port
      - "8100"
      - --vram-budget
      - ${TEXT_BUDGET:-22G}
      - --spec-type
      - draft-mtp
      - --spec-draft-n-max
      - "2"
      - --rs-rollback
      - replay
      - --max-output-tokens
      - "512"
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0
      - --metrics
      - --alias
      - qwen
    ports:
      - "8100:8100"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8100/health"]
      interval: 10s
      timeout: 5s
      start_period: 300s
      retries: 3
    ulimits:
      memlock: -1
      stack: 67108864
    volumes: *models
    deploy: *gpu

  paddleocr:
    image: inmoloc:latest
    container_name: paddleocr
    restart: unless-stopped
    ipc: host
    command:
      - --model
      - /models/PaddleOCR-VL-1.6/PaddleOCR-VL-1.6-Q8_0.gguf
      - --mmproj
      - /models/PaddleOCR-VL-1.6/PaddleOCR-VL-1.6-GGUF-mmproj.gguf
      - --chat-template-file
      - /models/PaddleOCR-VL-1.6/chat_template.jinja
      - -ngl
      - "999"
      - --host
      - 0.0.0.0
      - --port
      - "8110"
      - --max-output-tokens
      - "1024"
      - --vram-budget
      - ${OCR_BUDGET:-2.5G}
      - --cache-ram
      - "0"
      - --cache-type-k
      - bf16
      - --cache-type-v
      - bf16
      - --metrics
      - --alias
      - ocrt
    ports:
      - "8110:8110"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8110/health"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 3
    ulimits:
      memlock: -1
      stack: 67108864
    volumes: *models
    deploy: *gpu

  embedding:
    image: inmoloc:latest
    container_name: embedding
    restart: unless-stopped
    ipc: host
    command:
      - --model
      - /models/harrier-oss-v1-0.6b-BF16.gguf
      - --embedding
      - --pooling
      - last
      - -ngl
      - "999"
      - --host
      - 0.0.0.0
      - --port
      - "8101"
      - --batch-size
      - "2048"
      - --ubatch-size
      - "2048"
      - --vram-budget
      - 1.8G
      - --metrics
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0
      - --alias
      - harrier
    ports:
      - "8101:8101"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8101/v1/models"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    ulimits:
      memlock: -1
      stack: 67108864
    volumes: *models
    deploy: *gpu

  # llama.cpp services for benchmarking against the inmoloc equivalents above.
  # Text: python3 scripts/bench-server-concurrency.py --url http://localhost:8120 --levels 1 2 4 8 16 32 64 --prompt-tokens 64
  # OCR:  python3 bench_ocr.py --url http://localhost:8111 --label llamacpp --container paddleocr-llamacpp
  qwen-llamacpp:
    image: ${LLAMACPP_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda}
    container_name: qwen-llamacpp
    restart: "no"
    ipc: host
    command:
      - --model
      - /models/Kvark-Sparkle-1.0-27B-Q4_K_M.gguf
      - -ngl
      - "999"
      - --host
      - 0.0.0.0
      - --port
      - "8120"
      - -c
      - "${TEXT_CTX:-8192}"
      - --parallel
      - "${TEXT_PARALLEL:-8}"
      - --spec-type
      - draft-mtp
      - --spec-draft-n-max
      - "2"
      - --n-predict
      - "512"
      - --cache-ram
      - "2048"
      - --metrics
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0
      - --flash-attn
      - "on"
      - --alias
      - qwen
    ports:
      - "8120:8120"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8120/health"]
      interval: 10s
      timeout: 5s
      start_period: 300s
      retries: 3
    ulimits:
      memlock: -1
      stack: 67108864
    volumes: *models
    deploy: *gpu

  paddleocr-llamacpp:
    image: ${LLAMACPP_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda}
    container_name: paddleocr-llamacpp
    restart: "no"
    ipc: host
    command:
      - --model
      - /models/PaddleOCR-VL-1.6/PaddleOCR-VL-1.6-Q8_0.gguf
      - --mmproj
      - /models/PaddleOCR-VL-1.6/PaddleOCR-VL-1.6-GGUF-mmproj.gguf
      - --chat-template-file
      - /models/PaddleOCR-VL-1.6/chat_template.jinja
      - -ngl
      - "999"
      - --host
      - 0.0.0.0
      - --port
      - "8111"
      - -c
      - "${OCR_CTX:-184320}"
      - --parallel
      - "${OCR_PARALLEL:-45}"
      - --cache-ram
      - "4096"
      - --metrics
      - --cache-type-k
      - bf16
      - --cache-type-v
      - bf16
      - --flash-attn
      - "on"
      - --alias
      - ocrt
    ports:
      - "8111:8111"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8111/health"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 3
    ulimits:
      memlock: -1
      stack: 67108864
    volumes: *models
    deploy: *gpu
