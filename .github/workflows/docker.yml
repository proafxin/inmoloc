name: Docker

# publishes ghcr.io/proafxin/inmoloc on a version tag (v0.1.0 -> :0.1.0 and :latest), or by hand
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/inmoloc

jobs:
  image:
    name: ${{ matrix.name }} image
    runs-on: ubuntu-24.04
    # six CUDA architectures take a few hours on a hosted runner
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CUDA
            dockerfile: .devops/cuda.Dockerfile
            suffix: ""
            platforms: linux/amd64
          - name: CPU
            dockerfile: .devops/cpu.Dockerfile
            suffix: "-cpu"
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@v4
        with:
          # the version and commit the binaries report come from the git history
          fetch-depth: 0

      # the CUDA development image and the build need more disk than a runner has free
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Tags
        id: tags
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
            # the binaries report the version set in CMakeLists.txt: a tag must match it
            cmake_version="$(sed -nE 's/^set\(INMOLOC_VERSION_BASE "([^"]+)"\)/\1/p' CMakeLists.txt)"
            if [ "$version" != "$cmake_version" ]; then
              echo "::error::tag v$version does not match INMOLOC_VERSION_BASE $cmake_version in CMakeLists.txt"
              exit 1
            fi
            if [ -n "${{ matrix.suffix }}" ]; then latest="cpu"; else latest="latest"; fi
            tags="$IMAGE:${version}${{ matrix.suffix }},$IMAGE:${latest}"
            dev=OFF
          else
            version="$(git rev-parse --short HEAD)"
            tags="$IMAGE:sha-${version}${{ matrix.suffix }}"
            dev=ON
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dev=$dev" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: server
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.tags.outputs.version }}
            APP_REVISION=${{ github.sha }}
            BUILD_DATE=${{ steps.tags.outputs.date }}
            BUILD_IS_DEV=${{ steps.tags.outputs.dev }}
