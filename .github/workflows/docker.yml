name: Docker

# publishes ghcr.io/proafxin/inmoloc CUDA and CPU images when the version in pyproject.toml changes
on:
  push:
    paths: ["pyproject.toml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/inmoloc

jobs:
  image:
    name: ${{ matrix.name }} image
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CUDA
            dockerfile: .devops/cuda.Dockerfile
            suffix: ""
            platforms: linux/amd64
          - name: CPU
            dockerfile: .devops/cpu.Dockerfile
            suffix: "-cpu"
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Read version from pyproject.toml
        id: version
        run: |
          version="$(sed -nE 's/^version = "([^"]+)"/\1/p' pyproject.toml | head -1)"
          if [ -z "$version" ]; then
            echo "::error::no version found in pyproject.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Tags
        id: tags
        run: |
          version="${{ steps.version.outputs.version }}"
          if [ -n "${{ matrix.suffix }}" ]; then latest="cpu"; else latest="latest"; fi
          tags="$IMAGE:${version}${matrix.suffix},$IMAGE:${latest}"
          tags="$tags,$IMAGE:sha-${{ github.sha }}${matrix.suffix}"
          dev=ON
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "dev=$dev" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: server
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            APP_REVISION=${{ github.sha }}
            BUILD_DATE=${{ steps.tags.outputs.date }}
            BUILD_IS_DEV=${{ steps.tags.outputs.dev }}
