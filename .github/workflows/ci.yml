name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    name: CPU build and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DLLAMA_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release -j $(nproc)

      # the tokenizer tests clone vocab files stored with Git LFS
      - name: Unit tests
        run: |
          git lfs install --skip-repo
          ctest --test-dir build -L main --output-on-failure -j $(nproc)

      # the unit tests run the recurrent state rollback in snapshot mode, on the tiny models they generate
      - name: Recurrent state rollback by replay
        run: |
          for model in qwen35-dense nemotron_h-dense; do
            echo "== $model"
            ./build/bin/test-recurrent-state-rollback -m build/tests/test-models/$model.gguf -dev none -ngl 0 --rs-rollback replay
          done

  # No hosted server-test job: the box's indexed attention is CUDA-first (see README "for now it loads
  # the full model on a cuda GPU"), with no CPU-specific path, and GitHub's hosted runners have no GPU.
  # Run server tests locally against a real GPU instead; see tests/server/README.md.

  cuda:
    name: CUDA build
    runs-on: ubuntu-24.04
    container: nvidia/cuda:13.3.0-devel-ubuntu24.04
    steps:
      - name: Install build tools
        run: apt-get update && apt-get install -y cmake build-essential git

      - uses: actions/checkout@v4

      # the runners have no GPU: this checks that the CUDA kernels and the server build
      # they have no NVIDIA driver either, so the driver's library (libcuda.so.1) is left unresolved at link time
      - name: Configure
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DGGML_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=120a -DLLAMA_BUILD_TESTS=ON
          -DCMAKE_EXE_LINKER_FLAGS=-Wl,--allow-shlib-undefined

      - name: Build
        run: cmake --build build --config Release -j $(nproc) --target local-inference-server test-backend-ops
